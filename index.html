<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="A personal collection of books, movies, games, and things worth reading.">
  <title>Books | My collection</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f8f7f3'/%3E%3Cpath d='M18 13h28v38H18z' fill='%23545f4c'/%3E%3Cpath d='M23 13v38M29 23h11M29 29h8' stroke='%23f8f7f3' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <nav class="site-nav" aria-label="Main areas">
      <a data-area="books" href="#books">Books</a>
      <a data-area="movies" href="#movies">Movies</a>
      <a data-area="games" href="#games">Games</a>
      <a data-area="bits" href="#bits">Bits</a>
    </nav>
    <main id="main" tabindex="-1">
      <div class="intro">
        <div class="intro-heading">
          <h1 id="area-title">Books</h1>
          <span class="count-badge" id="count" role="status">Loading…</span>
        </div>
      </div>
      <div id="content" aria-busy="true"></div>
      <noscript>Please enable JavaScript to browse.</noscript>
    </main>
  </div>

  <dialog id="collection-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <div class="dialog-heading">
        <p class="eyebrow">Collection</p>
        <h2 class="dialog-title" id="dialog-title"></h2>
        <div class="card-meta" id="dialog-meta"></div>
      </div>
      <button type="button" class="close-button" data-close-dialog aria-label="Close collection" autofocus>×</button>
    </header>
    <div class="dialog-body">
      <p class="description" id="dialog-description" hidden></p>
      <ol class="grid dialog-grid" id="dialog-books"></ol>
    </div>
  </dialog>

  <dialog class="note-dialog" id="note-dialog" aria-labelledby="note-title">
    <header class="dialog-header">
      <div class="dialog-heading">
        <p class="eyebrow">My note</p>
        <h2 class="dialog-title" id="note-title"></h2>
      </div>
      <button type="button" class="close-button" data-close-dialog aria-label="Close note" autofocus>×</button>
    </header>
    <div class="dialog-body note-body" id="note-content"></div>
  </dialog>
</body>
</html>
